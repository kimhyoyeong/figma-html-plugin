<!doctype html>
<html>

<head>
  <meta charset="utf-8" />
  <style>
    /* --- Base · 헤더 · 탭 · 패널 공통 --- */
    body {
      margin: 0;
      font: 12px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    header {
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 10px;
      border-bottom: 1px solid #e7e7e7;
    }

    button {
      border: 1px solid #0d99ff;
      background: #0d99ff;
      color: #fff;
      padding: 7px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 700;
    }

    button.gray {
      border-color: #cfd8dc;
      background: #f6f7f8;
      color: #111;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .wrap {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 60px);
      min-height: 0;
    }

    .tabs {
      display: flex;
      flex-shrink: 0;
      border-bottom: 1px solid #e0e4e8;
    }

    .tabs button {
      padding: 8px 14px;
      border: 0;
      background: transparent;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      color: #666;
    }

    .tabs button.active {
      color: #0d99ff;
      border-bottom: 2px solid #0d99ff;
      margin-bottom: -1px;
    }

    .panel {
      display: none;
      flex: 1;
      min-height: 0;
      min-width: 0;
      flex-direction: column;
    }

    .panel.active {
      display: flex;
    }

    textarea {
      flex: 1;
      min-height: 0;
      border: 0;
      outline: 0;
      padding: 12px;
      resize: none;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 11px;
      line-height: 1.5;
    }

    .hint {
      margin-left: auto;
      color: #666;
      font-size: 11px;
    }

    .mobileOpt {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #333;
    }

    .mobileOpt input[type="checkbox"] {
      margin: 0;
      cursor: pointer;
    }

    .field {
      border: 1px solid #cfd8dc;
      background: #fff;
      color: #111;
      padding: 6px 10px;
      border-radius: 8px;
      outline: 0;
      font-size: 12px;
      width: 180px;
    }

    .fontRow {
      padding: 8px 10px;
      border-bottom: 1px solid #e0e4e8;
      background: #f7fafc;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .fontRowLabel {
      font-size: 11px;
      font-weight: 600;
      color: #555;
      flex-shrink: 0;
    }

    .fontCheckboxes {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 14px;
      max-height: 72px;
      overflow-y: auto;
    }

    .fontCheckboxes label {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: #333;
      cursor: pointer;
      white-space: nowrap;
    }

    .fontCheckboxes input {
      margin: 0;
      cursor: pointer;
    }

    /* --- 데이터 탭(툴바 · 트리 · 상세) --- */
    .dataWrap {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .dataToolbar {
      flex-shrink: 0;
      padding: 10px 14px;
      border-bottom: 1px solid #e0e4e8;
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: center;
      background: #f7fafc;
    }

    .dataToolbarGroup {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .dataToolbarGroup+.dataToolbarGroup {
      border-left: 1px solid #e0e4e8;
      padding-left: 16px;
    }

    .dataToolbarGroup.actions {
      gap: 8px;
    }

    .dataToolbar input,
    .dataToolbar select {
      border: 1px solid #cfd8dc;
      background: #fff;
      color: #111;
      padding: 6px 10px;
      border-radius: 8px;
      outline: 0;
      font-size: 12px;
    }

    .dataToolbarStatus {
      margin-left: auto;
      padding: 10px 12px;
      border-radius: 8px;
      color: #0d6db7;
      font-size: 12px;
      font-weight: 600;
    }

    .dataToolbarStatus.waiting {
      color: #666;
      font-weight: 500;
    }

    /* PC/MO 분석 진행 중 상태 텍스트 */
    @keyframes ap-analysis-pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.38;
      }
    }

    .analysis-pulse,
    #aiRefineStatus.is-analyzing {
      animation: ap-analysis-pulse 1.05s ease-in-out infinite;
    }

    @media (prefers-reduced-motion: reduce) {

      .analysis-pulse,
      #aiRefineStatus.is-analyzing {
        animation: none;
        opacity: 1;
      }
    }

    .dataToolbarStatus.error {
      color: #c53030;
    }

    .dataMain {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 10px;
      padding: 10px 12px;
      box-sizing: border-box;
    }

    .box {
      min-height: 0;
      border: 1px solid #e0e4e8;
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: #fff;
    }

    .boxHd {
      flex-shrink: 0;
      padding: 8px 10px;
      border-bottom: 1px solid #eef2f6;
      display: flex;
      gap: 8px;
      align-items: center;
      background: #fafcff;
      font-size: 11px;
      color: #333;
    }

    .boxBd {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 10px;
    }

    .tree {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      line-height: 1.55;
    }

    details {
      border-left: 1px solid transparent;
    }

    details[open] {
      border-left-color: #e7edf6;
    }

    details.secMismatch {
      border-left: 3px solid #c53030;
    }

    details.secMismatch[open] {
      border-left-color: #c53030;
    }

    .secMismatchBadge {
      font-size: 9px;
      padding: 1px 5px;
      border-radius: 4px;
      background: #fde8e8;
      color: #c53030;
      border: 1px solid #feb2b2;
      font-weight: 600;
    }

    summary {
      list-style: none;
      cursor: pointer;
      padding: 6px 8px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    summary::-webkit-details-marker {
      display: none;
    }

    summary:hover {
      background: #f2f7ff;
    }

    summary.selected {
      outline: 1px solid rgba(13, 153, 255, .35);
      background: rgba(13, 153, 255, .12);
    }

    .childPad {
      padding-left: 14px;
    }

    .badge {
      font-size: 10px;
      padding: 1px 6px;
      border: 1px solid #d7dee7;
      border-radius: 999px;
      color: #445;
      background: #fff;
      flex-shrink: 0;
    }

    .badge.flex {
      border-color: #cfe2ff;
      color: #1f4b99;
    }

    .badge.abs {
      border-color: #e3d3ff;
      color: #5b2aa6;
    }

    .badge.img {
      border-color: #cdeed9;
      color: #1c6b3b;
    }

    .badge.vec {
      border-color: #ffe2c7;
      color: #7a3f09;
    }

    .badge.txt {
      border-color: #ffd1de;
      color: #8a2340;
    }

    .name {
      color: #111;
    }

    .muted {
      color: #667;
      opacity: .95;
    }

    /* AI 반영 패널: 변경 diff (전폭 카드 · 변경 전/후 분리) */
    .ap-diff-block {
      margin: 0 0 14px 0;
      padding: 10px 12px;
      background: linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%);
      border-radius: 10px;
      border: 1px solid #e2e8f0;
    }

    .ap-diff-block > strong {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: #0f172a;
      letter-spacing: -0.02em;
      margin-bottom: 10px;
    }

    .ap-diff-rows {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-width: 0;
    }

    .ap-diff-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 10px 12px;
      background: #fff;
      border: 1px solid #e8edf3;
      border-radius: 8px;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
      min-width: 0;
    }

    .ap-diff-label {
      display: block;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #64748b;
      margin-bottom: 2px;
    }

    .ap-diff-label--from {
      color: #b45309;
    }

    .ap-diff-label--to {
      color: #15803d;
    }

    .ap-diff-arrow-row {
      text-align: center;
      color: #94a3b8;
      font-size: 12px;
      font-weight: 700;
      line-height: 1;
      padding: 2px 0;
      user-select: none;
    }

    .ap-diff-from,
    .ap-diff-to {
      display: block;
      margin: 0;
      padding: 8px 10px;
      border-radius: 6px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 10px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
      overflow-wrap: anywhere;
      max-width: 100%;
    }

    .ap-diff-from {
      color: #78350f;
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-left: 3px solid #f59e0b;
    }

    .ap-diff-to {
      color: #14532d;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-left: 3px solid #22c55e;
    }

    .ap-diff-arrow {
      display: none;
    }

    .detail {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      line-height: 1.6;
      padding: 2px 0;
    }

    .detailHead {
      padding-bottom: 10px;
      margin-bottom: 10px;
      border-bottom: 1px solid #e0e4e8;
    }

    .detail h3 {
      margin: 0 0 8px 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      font-weight: 700;
      color: #111;
      letter-spacing: -0.02em;
    }

    .detailFlags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 0;
    }

    .detailFlags .badge {
      font-size: 10px;
    }

    .detail .kv {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #eef2f6;
    }

    .detail .row {
      display: grid;
      grid-template-columns: 120px 1fr;
      gap: 10px 14px;
      align-items: start;
      padding: 8px 10px;
      margin: 0 -10px;
      border-radius: 6px;
      border-bottom: 1px solid rgba(0, 0, 0, .06);
      font-size: 11px;
    }

    .detail .row:nth-child(even) {
      background: #f8fafc;
    }

    .detail .row .k {
      color: #555;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .03em;
      word-break: break-word;
    }

    .detail .row .v {
      color: #111;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.5;
    }

    .detail .row.rowLabel .v {
      font-size: 10px;
      color: #333;
    }

    .detail .row.rowOutputClass .v {
      font-family: ui-monospace, monospace;
      color: #0d6db7;
      font-weight: 600;
    }

    .detail .row:last-child {
      border-bottom: 0;
    }

    .rawArea {
      display: none;
      flex: 1;
      min-height: 0;
    }

    /* --- 미리보기 패널 --- */
    .previewToolbar {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-shrink: 0;
      padding: 8px 12px;
      border-bottom: 1px solid #e7e7e7;
    }

    .previewToolbar .viewBtn {
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid #cfd8dc;
      background: #f6f7f8;
      color: #666;
    }

    .previewToolbar .viewBtn.active {
      border-color: #0d99ff;
      background: #0d99ff;
      color: #fff;
    }

    .previewToolbar .viewBtn:hover:not(.active) {
      background: #eef1f3;
    }

    #previewViewport {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      background: #e0e4e8;
      overflow: auto;
    }

    .previewSingleWrap {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .previewSplitWrap {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: row;
      gap: 12px;
      padding: 12px;
      align-items: stretch;
      justify-content: center;
      width: 100%;
      box-sizing: border-box;
    }

    .previewPane {
      display: flex;
      flex-direction: column;
      min-height: 0;
      min-width: 0;
    }

    .previewPane--pc {
      flex: 1 1 55%;
    }

    .previewPane--mo {
      flex: 0 0 auto;
      width: min(100%, 390px);
      max-width: 100%;
    }

    .previewPaneLabel {
      flex-shrink: 0;
      font-size: 11px;
      font-weight: 700;
      color: #334155;
      padding: 0 0 6px 2px;
      letter-spacing: 0.02em;
    }

    .previewPane iframe {
      flex: 1;
      min-height: 280px;
      width: 100%;
      border: 0;
      background: #fff;
      box-shadow: 0 2px 12px rgba(0, 0, 0, .12);
      border-radius: 8px;
    }

    .previewToolbarDualHint {
      font-size: 11px;
      font-weight: 600;
      color: #0d99ff;
      margin-left: 4px;
    }

    /* 유틸 */
    .u-hidden {
      display: none !important;
    }

    .fontRow.is-collapsed {
      display: none !important;
    }

    /* --- 코드 탭 · AI 검수/반영 --- */
    .codePanelCol {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
    }

    .codeToolbarRow {
      flex-shrink: 0;
      padding: 8px 12px 0;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .hint--flush {
      margin-left: 0;
    }

    .aiRefineBar {
      flex-shrink: 0;
      padding: 8px 12px;
      border-bottom: 1px solid #e7e7e7;
      background: #f8fafc;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .aiRefineRow {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .aiRefineLabel {
      font-size: 11px;
      font-weight: 700;
      color: #334;
    }

    .aiRefineSep {
      font-size: 10px;
      color: #888;
    }

    .field--key {
      width: 180px;
    }

    .field--model {
      width: 110px;
    }

    .field--edge {
      width: 62px;
    }

    .aiRefineHintLabel {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin: 0;
      cursor: pointer;
      white-space: nowrap;
    }

    #aiRefineStatus {
      margin-left: 0;
      font-size: 11px;
    }

    #aiAuditReport {
      display: none;
      max-height: 360px;
      overflow: auto;
      font-size: 10px;
      line-height: 1.45;
      border: 1px solid #dde4ea;
      border-radius: 8px;
      padding: 10px;
      background: #fff;
      color: #223;
    }

    #aiAuditReport.is-visible {
      display: block;
    }

    #aiAuditReport .ap-alt-audit-section {
      margin: 0 0 14px 0;
    }

    #aiAuditReport .ap-alt-audit-heading {
      display: block;
      margin-bottom: 8px;
      color: #1565c0;
    }

    #aiAuditReport .ap-alt-audit-grid,
    #aiAuditReport .ap-audit-result-grid {
      display: grid;
      gap: 10px;
      grid-template-columns: 1fr;
      min-width: 0;
    }

    #aiAuditReport .ap-alt-audit-grid--cols2,
    #aiAuditReport .ap-audit-result-grid--cols2 {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    #aiAuditReport .ap-alt-audit-card {
      padding: 10px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      background: #fff;
      min-width: 0;
    }

    .aiRefineFootnote {
      font-size: 10px;
      color: #667;
      line-height: 1.5;
    }

    #panel-code textarea#codeOut {
      flex: 1;
      min-height: 0;
    }

    .previewToolbarHint {
      display: none;
      font-size: 11px;
      color: #b8860b;
      margin-left: 8px;
    }

    .previewToolbarHint.is-visible {
      display: inline;
    }

    /* 단일 미리보기 iframe */
    #previewFrame {
      flex: 1;
      min-height: 0;
      width: 100%;
      border: 0;
      background: #fff;
    }

    #previewFrame.previewFrame--mo {
      width: 375px;
      max-width: 100%;
    }

    /* 단일 미리보기(이미지 로딩 중·PC 전용) */
    .previewSingleWrap iframe#previewFrame {
      flex: 1;
      min-height: 0;
    }

    .previewEmptyMsg {
      padding: 12px;
      color: #666;
    }

    /* Detail: MO 블록 (JS 문자열용) */
    .detailKvMo {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #e0e4e8;
    }

    .detailKvMo h4 {
      margin: 0 0 8px 0;
      font-size: 12px;
    }

    .detailKvMoTitle--unmatched {
      color: #b8860b;
    }

    .detailKvMoTitle--matched {
      color: #0d6db7;
    }
  </style>
</head>

<body>
  <header>
    <button id="runAnalyze" type="button">분석</button>

    <input id="projectName" class="field" placeholder="project (ex: signia_serum)" />
    <span class="hint" id="rootHint">ROOT 1개: PC 한 벌 · ROOT 2개: PC+MO(가로 큰 쪽=PC) @media 오버라이드</span>
  </header>
  <div id="fontRow" class="fontRow is-collapsed">
    <span class="fontRowLabel">폰트 (체크 = 텍스트로 처리, 미체크 = 이미지로 처리)</span>
    <div id="fontCheckboxes" class="fontCheckboxes"></div>
  </div>

  <div class="wrap">
    <div class="tabs">
      <button type="button" class="tab active" data-tab="data">데이터</button>
      <button type="button" class="tab" data-tab="code">코드·AI</button>
      <button type="button" class="tab" data-tab="preview">미리보기</button>
      <span class="dataToolbarStatus waiting" id="dataStatus">분석 대기 중…</span>
    </div>

    <!-- ===== DATA ===== -->
    <div id="panel-data" class="panel active">
      <div class="dataWrap">
        <div class="dataToolbar">
          <div class="dataToolbarGroup actions">
            <button type="button" id="openAll" class="gray">모두 펼치기</button>
            <button type="button" id="closeAll" class="gray">모두 접기</button>
          </div>
        </div>

        <div class="dataMain">
          <!-- left: tree -->
          <div class="box">
            <div class="boxHd">
              <b>Tree</b>
              <span class="muted" id="treeMeta">-</span>
            </div>
            <div class="boxBd">
              <div id="tree" class="tree"></div>
              <textarea id="out" class="rawArea" placeholder="선택 분석 후 덤프 결과가 표시됩니다"></textarea>
            </div>
          </div>

          <!-- right: detail -->
          <div class="box">
            <div class="boxHd">
              <b>Detail</b>
              <span class="muted" id="selPill">선택 없음</span>
            </div>
            <div class="boxBd">
              <div id="detail" class="detail">
                <div class="muted">트리에서 노드를 선택하면 상세 정보가 표시됩니다</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ===== CODE ===== -->
    <div id="panel-code" class="panel">
      <div class="codePanelCol">
        <div class="codeToolbarRow">
          <button type="button" id="exportZip" class="gray">Export ZIP</button>
          <span class="hint hint--flush">_cms.html + assets/images/page_{project}_secXX_imgYY</span>
        </div>

        <div id="aiRefineBar" class="aiRefineBar">
          <div class="aiRefineRow">
            <span class="aiRefineLabel">AI</span>
            <button type="button" id="btnAiAudit" class="gray" title="SEO·접근성·시멘틱·alt·헤딩 검수 리포트">분석</button>

    /** code.js normalizeFontFamilyForMatch 와 동일하게 Noto* → 키 "noto" (체크 한 덩어리) */
    function normalizeFontKey(family) {
      var k = String(family || "")
        .toLowerCase()
        .trim()
        .replace(/[\-_]+/g, " ")
        .replace(/\s+/g, " ")
        .trim();
      var compact = k.replace(/\s/g, "");
      if (/^noto/i.test(compact)) return "noto";
      return k;
    }

      return fontChecked[normalizeFontKey(family)] !== false;
    }

    function setFontCheckedValue(family, checked) {
      var key = normalizeFontKey(family);
      if (!key) return;
      fontChecked[key] = checked !== false;
    }

    function syncFontState(nextFonts, preserveExisting) {
      var next = {};
      (nextFonts || []).forEach(function (family) {
        var key = normalizeFontKey(family);
        if (!key) return;

          ? fontChecked[key] !== false
          : true;
      });
      fontChecked = next;

      st.classList.toggle("analysis-pulse", !!(t && t.indexOf("분석 중") === 0));
    }

    $("#openAll").onclick = function () { toggleAll(true); };
    $("#closeAll").onclick = function () { toggleAll(false); };

    // ====== code.js → UI (postMessage) ======
    onmessage = function (e) {
      var msg = e.data.pluginMessage;
      if (!msg) return;

      if (msg.type === "LOADING") setLoading(!!msg.value);
      if (msg.type === "PROGRESS") setProgress(msg.phase, msg.current, msg.total);

      if (msg.type === "RESULT") {
        setLoading(false);

        var nImgExpect = msg.imageCount || 0;
        var lateResultAfterImages =
          nImgExpect > 0 &&
          msg.ingestId != null &&
          msg.ingestId === previewImagesCommittedIngestId &&
          previewImagesReady;

        payloadText = msg.text || "";
        dataTree = msg.dataTree || null;
        mobileDataTree = msg.mobileDataTree || null;
        if (mobileDataTree && typeof msg.moBreakpoint === "number" && msg.moBreakpoint > 0) {
          lastMoBreakpoint = msg.moBreakpoint;
        } else {
          lastMoBreakpoint = null;
        }
        if (!mobileDataTree && previewViewMode === "mo") {
          setPreviewView("pc");
        }
        separateViews = !!msg.separateViews;
        hybridMismatchSecs = msg.hybridMismatchSecs && Array.isArray(msg.hybridMismatchSecs) ? msg.hybridMismatchSecs : [];
        if (msg.vectorTypes && msg.vectorTypes.length) vectorTypes = msg.vectorTypes;

        usedFonts = Array.isArray(msg.usedFonts) ? msg.usedFonts.slice() : [];
        syncFontState(usedFonts, true);
        hasAnalyzedOnce = true;
        renderFontCheckboxes();

        $("#out").value = payloadText;
        $("#codeOut").value = msg.code != null ? msg.code : "";

        if (!lateResultAfterImages) {
          previewIngestId = msg.ingestId != null ? msg.ingestId : null;
          previewImagesCommittedIngestId = null;
          resultImagesBuffer = [];
          previewImagesReady = nImgExpect <= 0;
          if (nImgExpect <= 0) {
            previewImages = msg.images || [];
            refreshPreview();
          } else {
            previewImages = [];
          }
        }

        renderDataTree(dataTree);
        updatePreviewToolbar();
        var sectionCount = dataTree && dataTree.sections ? dataTree.sections.length : 0;
        var statusBase = sectionCount > 0 ? ("완료 · 섹션 " + sectionCount + "개") : "완료 · 섹션 0개 (보이는 자식 없음)";
        setStatusText(
          separateViews
            ? statusBase + " · 레이어 구조가 다르면 PC/MO를 각각 표시합니다"
            : mobileDataTree
              ? statusBase + " · PC+MO @media 오버라이드 포함"
              : statusBase
        );
      }

      if (msg.type === "RESULT_IMAGES_CHUNK") {
        if (previewIngestId != null && msg.ingestId != null && msg.ingestId !== previewIngestId) return;
        if (previewIngestId != null && msg.ingestId == null) return;
        resultImagesBuffer.push({ name: msg.name || ("img_" + (msg.index ?? 0) + ".png"), dataUrl: msg.dataUrl || "" });
      }
      if (msg.type === "RESULT_IMAGES_END") {
        if (previewIngestId != null && msg.ingestId != null && msg.ingestId !== previewIngestId) return;
        previewImages = resultImagesBuffer.slice();
        resultImagesBuffer = [];
        previewImagesReady = true;
        if (msg.ingestId != null) previewImagesCommittedIngestId = msg.ingestId;
        refreshPreview();
        updatePreviewToolbar();
      }

      if (msg.type === "ZIP_IMAGES") {
        setLoading(false);
        zipImagesBuffer = [];
        zipImagesCode = msg.code != null ? msg.code : (($("#codeOut") && $("#codeOut").value) || "");
        if ($("#codeOut")) $("#codeOut").value = zipImagesCode;
      }

      if (msg.type === "ZIP_IMAGES_CHUNK") {
        zipImagesBuffer.push({ name: msg.name || ("img_" + (msg.index ?? 0) + ".png"), dataUrl: msg.dataUrl || "" });
      }

      if (msg.type === "ZIP_IMAGES_END") {
        setExportZipReady();
        var zipImages = zipImagesBuffer.slice();
        var exportHtml = getPreviewHtml(true);
        if (!exportHtml && zipImagesCode.trim()) {
          var raw = zipImagesCode.trim();
          if (!/^<!DOCTYPE\s+html/i.test(raw)) raw = "<!DOCTYPE html><html><head><meta charset=\"utf-8\"></head><body>" + raw + "</body></html>";
          exportHtml = raw;
        }
        if (!exportHtml) return;

        var zip = new JSZip();
        zip.file("_cms.html", exportHtml);
        zipImages.forEach(function (item) {
          var base64 = (item.dataUrl || "").replace(/^data:image\/[^;]+;base64,/, "");
          if (base64) zip.file(item.name, base64, { base64: true });
        });
        zip.generateAsync({ type: "blob" }).then(function (blob) {
          var now = new Date();
          var y = now.getFullYear();
          var m = String(now.getMonth() + 1).padStart(2, "0");
          var d = String(now.getDate()).padStart(2, "0");
          var h = String(now.getHours()).padStart(2, "0");
          var min = String(now.getMinutes()).padStart(2, "0");
          var sec = String(now.getSeconds()).padStart(2, "0");
          var dateTime = y + "-" + m + "-" + d + "_" + h + min + sec;
          var a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = "export_" + dateTime + ".zip";
          a.click();
          URL.revokeObjectURL(a.href);
          setStatusText("ZIP 다운로드 완료");
        });
        previewImages = zipImages;
        refreshPreview();
        zipImagesBuffer = [];
      }

      if (msg.type === "OPENAI_KEY_LOADED") {
        cachedOpenaiKey = msg.key != null ? String(msg.key) : "";
        var ok = $("#openaiKey");
        if (ok && cachedOpenaiKey) ok.value = cachedOpenaiKey;
      }
      if (msg.type === "OPENAI_KEY_SAVED") {
        var stAi = $("#aiRefineStatus");
        if (stAi) stAi.textContent = "API 키 저장됨";
      }
      if (msg.type === "OPENAI_KEY_ERROR") {
        var stE = $("#aiRefineStatus");
        if (stE) stE.textContent = "키 저장 실패: " + (msg.message || "");
      }

      if (msg.type === "ERROR") {
        setLoading(false);
        setExportZipReady();

        payloadText = "ERROR: " + (msg.message || "");
        dataTree = null;
        mobileDataTree = null;
        lastMoBreakpoint = null;
        previewIngestId = null;
        previewImagesCommittedIngestId = null;
        separateViews = false;
        hybridMismatchSecs = [];
        selectedNode = null;
        usedFonts = [];
        syncFontState([], false);
        hasAnalyzedOnce = false;
        renderFontCheckboxes();

        $("#out").value = payloadText;
        // 코드 탭은 유지 (Export ZIP 실패 시에도 코드 보존)

        $("#tree").innerHTML = "";
        $("#detail").innerHTML = "<div class='detailHead'><h3>에러</h3><div class='muted'>" + escapeHtml(msg.message || "") + "</div></div>";
        $("#selPill").textContent = "선택 없음";
        $("#treeMeta").textContent = "-";

        previewImages = [];
        previewImagesReady = true;
        if (previewViewMode === "mo") {
          setPreviewView("pc");
        } else {
          refreshPreview();
        }
        updatePreviewToolbar();

        setStatusText("ERROR");
      }
    };

    // ====== 데이터 트리 · Detail 패널 ======
    function renderDataTree(dt) {
      $("#tree").innerHTML = "";
      selectedNode = null;
      updateDetail(null);

      if (!dt || !dt.sections || !dt.sections.length) {
        $("#treeMeta").textContent = "-";
        var emptyMsg = document.createElement("div");
        emptyMsg.className = "muted";
        emptyMsg.style.cssText = "padding:12px; line-height:1.5;";
        emptyMsg.innerHTML =
          "섹션 트리가 없습니다.<br><br>" +
          "• ROOT로 선택한 프레임에 <b>보이는 직계 자식</b>이 있어야 합니다(자식마다 섹션 1개).<br>" +
          "• 자식이 없거나 전부 숨김이면 표시되지 않습니다.<br>" +
          "• 여러 섹션이 필요하면 ROOT 아래에 프레임을 나란히 두세요.";
        $("#tree").appendChild(emptyMsg);
        return;
      }

      $("#treeMeta").textContent = "sections=" + dt.sections.length;

      dt.sections.forEach(function (sec) {
        var rootNode = sec.node;
        var secClass = (sec.title || "").replace(/^Section\s+/i, "").trim();
        var isMismatch = hybridMismatchSecs && hybridMismatchSecs.indexOf(secClass) >= 0;

        var secWrap = document.createElement("details");
        secWrap.open = true;
        if (isMismatch) secWrap.className = "secMismatch";

        var sum = document.createElement("summary");
        sum.innerHTML =
          '<span class="badge">SECTION</span>' +
          '<span class="name">' + escapeHtml(sec.title || "") + '</span>' +
          (isMismatch ? '<span class="secMismatchBadge">PC/MO 불일치</span>' : '');

        secWrap.appendChild(sum);

        var body = document.createElement("div");
        body.className = "childPad";
        body.appendChild(renderNode(rootNode));
        secWrap.appendChild(body);

        $("#tree").appendChild(secWrap);
      });
    }

    function renderNode(node) {
      var d = document.createElement("details");
      d.open = false;

      var sum = document.createElement("summary");
      var meta = parseMetaFromLabel(node.label || "");

      sum.dataset.type = meta.type;
      sum.dataset.flags = meta.flags.join(",");
      sum.dataset.name = meta.name;
      sum.dataset.search = buildSearchBlob(node, meta);

      sum.innerHTML =
        meta.flags.map(function (f) { return badgeHtml(f); }).join("") +
        '<span class="name">' + escapeHtml(meta.type) + '</span>' +
        '<span class="muted">"' + escapeHtml(meta.name) + '"</span>';

      sum.addEventListener("click", function () {
        markSelected(sum);
        selectedNode = node;
        updateDetail(node);
      });

      d.appendChild(sum);

      var children = node.children || [];
      if (children.length) {
        var body = document.createElement("div");
        body.className = "childPad";
        children.forEach(function (ch) { body.appendChild(renderNode(ch)); });
        d.appendChild(body);
      }

      return d;
    }

    function badgeHtml(flag) {
      var cls = "";
      if (flag === "FLEX") cls = "flex";
      else if (flag === "ABS") cls = "abs";
      else if (flag === "IMG_FILL" || flag === "COMPOSITE?") cls = "img";
      else if (flag === "VEC_ONLY") cls = "vec";
      else if (flag === "TEXT") cls = "txt";
      return '<span class="badge ' + cls + '">' + escapeHtml(flag) + '</span>';
    }

    function getNodeByPath(dt, path) {
      if (!dt || !dt.sections || !path || !path.length) return null;
      var secIdx = path[0] - 1;
      if (secIdx < 0 || secIdx >= dt.sections.length) return null;
      var n = dt.sections[secIdx].node;
      for (var i = 1; i < path.length; i++) {
        if (!n.children || path[i] >= n.children.length) return null;
        n = n.children[path[i]];
      }
      return n;
    }

    function normNameForMatch(s) {
      var t = String(s || "").trim();
      if (t.length >= 2 && ((t.charAt(0) === "'" && t.charAt(t.length - 1) === "'") || (t.charAt(0) === '"' && t.charAt(t.length - 1) === '"')))
        return t.slice(1, -1).trim();
      return t;
    }
    function getNodeByTypeAndName(dt, type, name) {
      if (!dt || !dt.sections || type == null || name == null) return null;
      var typeStr = String(type);
      var nameNorm = normNameForMatch(name);
      function walk(n) {
        if (!n) return null;
        var m = parseMetaFromLabel(n.label || "");
        if (m.type === typeStr && normNameForMatch(m.name) === nameNorm) return n;
        if (n.children) for (var i = 0; i < n.children.length; i++) { var r = walk(n.children[i]); if (r) return r; }
        return null;
      }
      for (var s = 0; s < dt.sections.length; s++) {
        var r = walk(dt.sections[s].node);
        if (r) return r;
      }
      return null;
    }

    function parseMetaFromLabel(label) {
      var s = String(label || "").trim();
      var m = s.match(/([A-Z_]+)\s+"([^"]*)"(?:\s+\[([^\]]+)\])?.*$/);
      var type = m ? m[1] : "NODE";
      var name = m ? m[2] : s;
      var flags = (m && m[3]) ? m[3].split(",").map(function (x) { return x.trim(); }).filter(Boolean) : [];
      return { type: type, name: name, flags: flags };
    }

    function buildSearchBlob(node, meta) {
      var parts = [];
      parts.push(meta.type, meta.name, meta.flags.join(" "));
      (node.props || []).forEach(function (p) { parts.push(p); });
      return parts.join(" ").toLowerCase();
    }

    function markSelected(sumEl) {
      document.querySelectorAll("summary.selected").forEach(function (x) { x.classList.remove("selected"); });
      sumEl.classList.add("selected");
      $("#selPill").textContent = '선택: ' + (sumEl.dataset.type || "NODE") + ' "' + (sumEl.dataset.name || "") + '"';
    }

    function updateDetail(node) {
      if (!node) {
        $("#detail").innerHTML = "<div class='detailHead'><h3>노드 상세 정보</h3><div class='muted'>트리에서 항목을 클릭하면 상세 정보가 표시됩니다</div></div>";
        $("#selPill").textContent = "선택 없음";
        return;
      }
      var meta = parseMetaFromLabel(node.label || "");
      var props = node.props || [];
      var childrenCount = (node.children || []).length;

      var html = "";
      html += "<div class='detailHead'>";
      html += "<h3>" + escapeHtml(meta.type) + " \"" + escapeHtml(meta.name) + "\"</h3>";
      if (meta.flags && meta.flags.length) {
        html += "<div class='detailFlags'>";
        meta.flags.forEach(function (f) { html += badgeHtml(f); });
        html += "</div>";
      }
      html += "</div>";
      html += "<div class='kv'>";

      html += row("타입", meta.type);
      html += row("이름", meta.name);
      html += row("자식 수", String(childrenCount));

      if (node.textMeta) {
        var tm = node.textMeta;
        var parts = [];
        if (tm.fs !== undefined && tm.fs !== "") parts.push("font-size:" + tm.fs + "px");
        if (tm.lh !== undefined && tm.lh !== "") parts.push("line-height:" + tm.lh + (Number(tm.lh) <= 3 ? "" : "px"));
        if (tm.fontFamily !== undefined && tm.fontFamily !== "") parts.push("font:" + (tm.fontFamily || "") + (tm.fontStyle ? " " + tm.fontStyle : ""));
        if (tm.fw !== undefined && tm.fw !== "") parts.push("font-weight:" + tm.fw);
        if (tm.ta !== undefined && tm.ta !== "") parts.push("text-align:" + tm.ta);
        if (tm.clr !== undefined && tm.clr !== "") parts.push("color:" + tm.clr);
        if (tm.sizeW !== undefined && tm.sizeH !== undefined) parts.push("size:" + tm.sizeW + "×" + tm.sizeH);
        if (tm.ls !== undefined && tm.ls !== "") parts.push("letter-spacing:" + tm.ls + "em");
        html += row("텍스트 스타일", parts.join("; "));
      }

      var keyOrder = ["sectionRelative", "position", "flex", "layoutChild", "bg", "bgImage", "text", "vector"];
      var keyLabel = {
        sectionRelative: "섹션 기준", position: "위치", flex: "플렉스", layoutChild: "레이아웃",
        bg: "배경", bgImage: "배경 이미지", text: "내용", vector: "벡터"
      };
      var parsed = props.map(function (p) { var kv = parsePropLine(p); return { key: kv.key, value: kv.value }; });

      function getParsed(key) { for (var i = 0; i < parsed.length; i++) if (parsed[i].key === key) return parsed[i].value; return null; }
      var bgVal = getParsed("bg");
      var bgImageVal = getParsed("bgImage");
      if (bgVal || bgImageVal) {
        html += row("배경", [bgVal, bgImageVal].filter(Boolean).join("; "));
      }

      keyOrder.forEach(function (orderedKey) {
        if (orderedKey === "bg" || orderedKey === "bgImage") return;
        for (var i = 0; i < parsed.length; i++) {
          if (parsed[i].key === orderedKey) {
            html += row(keyLabel[orderedKey] || orderedKey, parsed[i].value);
            return;
          }
        }
      });
      parsed.forEach(function (kv) {
        if (kv.key !== "bg" && kv.key !== "bgImage" && keyOrder.indexOf(kv.key) === -1) html += row(keyLabel[kv.key] || kv.key, kv.value);
      });

      if (mobileDataTree && node.path && node.path.length) {
        if (separateViews) {
          html += "<div class='kv detailKvMo'><h4 class='detailKvMoTitle--unmatched'>MO</h4>";
          html += row("상태", "레이어 구조가 달라 매칭 불가");
          html += "</div>";
        } else {
          var moNode = getNodeByPath(mobileDataTree, node.path);
          if (moNode) {
            html += "<div class='kv detailKvMo'><h4 class='detailKvMoTitle--matched'>MO (매칭)</h4>";
            var hasMoContent = false;
            if (moNode.textMeta) {
              var tm2 = moNode.textMeta;
              var moParts = [];
              if (tm2.fs !== undefined && tm2.fs !== "") moParts.push("font-size:" + tm2.fs + "px");
              if (tm2.lh !== undefined && tm2.lh !== "") moParts.push("line-height:" + tm2.lh + (Number(tm2.lh) <= 3 ? "" : "px"));
              if (tm2.fontFamily !== undefined && tm2.fontFamily !== "") moParts.push("font:" + (tm2.fontFamily || "") + (tm2.fontStyle ? " " + tm2.fontStyle : ""));
              if (tm2.fw !== undefined && tm2.fw !== "") moParts.push("font-weight:" + tm2.fw);
              if (tm2.ta !== undefined && tm2.ta !== "") moParts.push("text-align:" + tm2.ta);
              if (tm2.clr !== undefined && tm2.clr !== "") moParts.push("color:" + tm2.clr);
              if (moParts.length) { html += row("텍스트 스타일", moParts.join("; ")); hasMoContent = true; }
            }
            if (moNode.props && moNode.props.length) {
              var moParsed = moNode.props.map(function (p) { var kv = parsePropLine(p); return { key: kv.key, value: kv.value }; });
              keyOrder.forEach(function (orderedKey) {
                for (var i = 0; i < moParsed.length; i++) {
                  if (moParsed[i].key === orderedKey) {
                    html += row((keyLabel[orderedKey] || orderedKey), moParsed[i].value);
                    hasMoContent = true;
                    return;
                  }
                }
              });
              moParsed.forEach(function (kv) {
                if (keyOrder.indexOf(kv.key) === -1) { html += row(keyLabel[kv.key] || kv.key, kv.value); hasMoContent = true; }
              });
            }
            if (!hasMoContent) html += row("상태", "인덱스 매칭 (레이어 순서 동일)");
            html += "</div>";
          }
        }
      }
      html += "</div>";

      $("#detail").innerHTML = html;
    }

    function parsePropLine(p) {
      if (typeof p !== "string") return { key: "prop", value: String(p) };
      var idx = p.indexOf(":");
      if (idx === -1) return { key: "prop", value: p.trim() };
      var k = p.substring(0, idx).trim();
      var v = p.substring(idx + 1).trim();
      return { key: k || "prop", value: v };
    }

    function row(k, v, rowClass) {
      var cls = "row" + (rowClass ? " " + rowClass : "");
      return "<div class='" + cls + "'><div class='k'>" + escapeHtml(k) + "</div><div class='v'>" + escapeHtml(v) + "</div></div>";
    }

    function toggleAll(open) {
      $("#tree").querySelectorAll("details").forEach(function (d) { d.open = open; });
    }

    // ====== 미리보기: HTML 조립 · iframe · blob URL ======
    /** PC 미리보기 meta width (중첩 iframe에서 뷰포트 클램프 보정) */
    var PREVIEW_PC_LAYOUT_WIDTH = 1440;
    var previewBlobUrl = null;
    var previewBlobUrlPc = null;
    var previewBlobUrlMo = null;

    function revokeAllPreviewBlobs() {
      if (previewBlobUrl) {
        URL.revokeObjectURL(previewBlobUrl);
        previewBlobUrl = null;
      }
      if (previewBlobUrlPc) {
        URL.revokeObjectURL(previewBlobUrlPc);
        previewBlobUrlPc = null;
      }
      if (previewBlobUrlMo) {
        URL.revokeObjectURL(previewBlobUrlMo);
        previewBlobUrlMo = null;
      }
    }

    function tryAssignIframeContent(frame, html, which) {
      if (!frame) return;
      try {
        frame.removeAttribute("src");
        frame.srcdoc = html;
      } catch (e) {
        var blob = new Blob([html], { type: "text/html;charset=utf-8" });
        var u = URL.createObjectURL(blob);
        if (which === "pc") previewBlobUrlPc = u;
        else if (which === "mo") previewBlobUrlMo = u;
        else previewBlobUrl = u;
        frame.src = u;
      }
    }

    function stripEmbeddedAuditReport(html) {
      return String(html || "").replace(
        /<!--\s*ap-ai-audit:start\s*-->[\s\S]*?<!--\s*ap-ai-audit:end\s*-->\s*/gi,
        ""
      );
    }

    function escapeForRegExp(s) {
      return String(s).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    }

    /** 중첩 iframe에서 뷰포트가 좁게 고정될 때 MO @media가 항상 참이 되는 것을 막기 위해, 해당 bp만 무력화 */
    function suppressHybridMoMediaAtBreakpoint(fragment, bp) {
      var num = Number(bp);
      if (!(num > 0)) return String(fragment || "");
      var esc = escapeForRegExp(String(num));
      var mediaRe = new RegExp("@media\\s*\\(\\s*max-width\\s*:\\s*" + esc + "\\s*px\\s*\\)", "gi");
      var out = String(fragment || "").replace(mediaRe, "@media (max-width:0px)");
      var attrRe = new RegExp("(media\\s*=\\s*[\"'])(\\(\\s*max-width\\s*:\\s*" + esc + "\\s*px\\s*\\))([\"'])", "gi");
      return out.replace(attrRe, "$1(max-width:0px)$3");
    }

    function getPreviewHtml(forExport, forceViewportWidth, previewStripMoMq) {
      var raw = stripEmbeddedAuditReport(($("#codeOut") && $("#codeOut").value) || "");
      if (!raw.trim()) return "";

      // <style> 앞부분(<!--CMS-->, Swiper <link> 등)은 제거 후 style 뒤에 붙이면 순서가 뒤바뀌므로 유지
      var styleIdx = raw.indexOf("<style>");
      var prefixBeforeStyle = styleIdx > 0 ? raw.substring(0, styleIdx).trim() : "";
      var rest = styleIdx >= 0 ? raw.substring(styleIdx) : raw;

      var styleMatches = rest.match(/<style>[\s\S]*?<\/style>/ig) || [];
      var style = styleMatches.join("\n");
      var body = rest.replace(/<style>[\s\S]*?<\/style>/ig, "").replace(/^\s+/, "");

      if (!forExport && previewStripMoMq && typeof lastMoBreakpoint === "number" && lastMoBreakpoint > 0) {
        style = suppressHybridMoMediaAtBreakpoint(style, lastMoBreakpoint);
        body = suppressHybridMoMediaAtBreakpoint(body, lastMoBreakpoint);
      }

      if (!forExport && previewImages.length) {
        var pathToDataUrl = {};
        previewImages.forEach(function (item) {
          pathToDataUrl[item.name] = item.dataUrl;
          if (item.name && item.name.toLowerCase) pathToDataUrl[item.name.toLowerCase()] = item.dataUrl;
        });
        var imgRe = /\b(assets\/images\/page_[a-zA-Z0-9_-]+_sec\d+_img\d+(_mo)?\.(?:png|jpg|jpeg|svg))\b/gi;
        function replacePath(m) {
          var data = pathToDataUrl[m] || pathToDataUrl[m.toLowerCase()];
          if (data) return data;
          if (/_mo\.(png|jpg|jpeg|svg)$/i.test(m)) {
            var pcPath = m.replace(/_mo\.(png|jpg|jpeg|svg)$/i, ".$1");
            return pathToDataUrl[pcPath] || pathToDataUrl[pcPath.toLowerCase()] || m;
          }
          return m;
        }
        body = body.replace(imgRe, replacePath);
        style = style.replace(imgRe, replacePath);
      }

      var baseStyle = "<style>body{margin:0;min-height:100vh;background:#f5f5f5;}</style>";
      var viewport = (forceViewportWidth > 0)
        ? '<meta name="viewport" content="width=' + forceViewportWidth + ', initial-scale=1">'
        : '<meta name="viewport" content="width=device-width, initial-scale=1">';
      var inner = (prefixBeforeStyle ? prefixBeforeStyle + "\n" : "") + style + "\n\n" + body;
      return '<!DOCTYPE html><html><head><meta charset="utf-8">' + viewport + baseStyle + "</head><body>" + inner + "</body></html>";
    }

    /** AI 분석 시 CMS 등록 영역만 사용 — <style>...</style> + <article class="ap-post">...</article> */
    function extractCmsPartForAudit(code) {
      if (!code || !String(code).trim()) return code;
      var parts = [];
      var s = String(code);
      var styleRe = /<style[^>]*>[\s\S]*?<\/style>/gi;
      var styleM;
      while ((styleM = styleRe.exec(s)) !== null) parts.push(styleM[0]);
      var articleRe = /<article\b[^>]*\bclass\s*=\s*["'][^"']*\bap-post\b[^"']*["'][^>]*>/i;
      var articleOpen = s.search(articleRe);
      if (articleOpen === -1) return parts.length ? parts.join("\n") : code;
      var afterOpen = s.indexOf(">", articleOpen) + 1;
      var depth = 1;
      var pos = afterOpen;
      while (depth > 0 && pos < s.length) {
        var nextOpen = s.indexOf("<article", pos);
        var nextClose = s.indexOf("</article>", pos);
        if (nextClose === -1) break;
        if (nextOpen !== -1 && nextOpen < nextClose) {
          depth++;
          pos = s.indexOf(">", nextOpen) + 1;
        } else {
          depth--;
          if (depth === 0) {
            parts.push(s.substring(articleOpen, nextClose + "</article>".length));
            break;
          }
          pos = nextClose + 10;
        }
      }
      return parts.length ? parts.join("\n") : code;
    }

    /** CMS 본문 기준: article.ap-post 내부 <img> 만 집계(주석·깨진 태그의 regex 오탈 방지). */
    function queryArticlePostImgs(doc) {
      if (!doc || !doc.querySelector) return [];
      var art = doc.querySelector("article.ap-post");
      if (!art) return [];
      return Array.prototype.slice.call(art.querySelectorAll("img"));
    }

    function countImgs(code) {
      try {
        return queryArticlePostImgs(parseAuditDocument(code)).length;
      } catch (e) {
        var m = String(code || "").match(/<img\b/gi);
        return m ? m.length : 0;
      }
    }

    /** 분석용: article.ap-post 내 <img> DOM 순서대로 alt·src */
    function collectImgAuditRowsFromCode(htmlCode) {
      try {
        var imgs = queryArticlePostImgs(parseAuditDocument(htmlCode));
        return imgs.map(function (img) {
          return {
            currentAlt: img.getAttribute("alt") != null ? String(img.getAttribute("alt")) : "",
            srcHint: String(img.getAttribute("src") || "").slice(0, 96)
          };
        });
      } catch (e) {
        var rows = [];
        var re = /<img\b[^>]*>/gi;
        var s = String(htmlCode || "");
        var m;
        while ((m = re.exec(s)) !== null) {
          var tag = m[0];
          var altM = tag.match(/\balt\s*=\s*["']([^"']*)["']/i);
          var srcM = tag.match(/\bsrc\s*=\s*["']([^"']*)["']/i);
          rows.push({
            currentAlt: altM ? altM[1] : "",
            srcHint: srcM ? String(srcM[1]).slice(0, 96) : ""
          });
        }
        return rows;
      }
    }

    /**
     * API가 alts를 비우거나 개수를 틀리면 리포트에 Alt 검수가 안 보임.
     * altProposals·마크업으로 길이 맞춤 및 alts 재구성.
     */
    function normalizeImgAltAudit(htmlCode, obj) {
      if (!obj || typeof obj !== "object") return obj;
      var cw = obj._apClientWarnings;
      if (!Array.isArray(cw)) cw = [];
      obj._apClientWarnings = cw;

      var n = countImgs(htmlCode);
      if (n === 0) {
        if (!Array.isArray(obj.alts)) obj.alts = [];
        if (!Array.isArray(obj.altProposals)) obj.altProposals = [];
        return obj;
      }
      var imgs = collectImgAuditRowsFromCode(htmlCode);
      var rawProp = Array.isArray(obj.altProposals) ? obj.altProposals.slice() : [];
      if (rawProp.length !== n) {
        cw.push(
          "모델 altProposals 길이(" +
          rawProp.length +
          ")가 <img> 개수(" +
          n +
          ")와 달라 클라이언트에서 맞췄습니다. 빠진 칸은 현재 alt로 채웠습니다."
        );
      }
      var normProp = [];
      var i;
      for (i = 0; i < n; i++) {
        var cur0 = imgs[i] ? String(imgs[i].currentAlt || "") : "";
        var p0 = i < rawProp.length && rawProp[i] != null ? String(rawProp[i]) : cur0;
        normProp.push(p0);
      }
      obj.altProposals = normProp;

      var alts = Array.isArray(obj.alts) ? obj.alts : [];
      var altsOk =
        alts.length === n &&
        alts.every(function (it, idx) {
          var ix = it && it.index != null ? Number(it.index) : idx + 1;
          return ix === idx + 1;
        });
      if (altsOk) {
        if (!Array.isArray(obj.altProposals) || obj.altProposals.length !== n) {
          obj.altProposals = alts.map(function (it) {
            return it && it.proposal != null ? String(it.proposal) : "";
          });
        }
        return obj;
      }

      cw.push(
        alts.length === 0
          ? "모델이 alts 배열을 비웠거나 누락해, altProposals·DOM 순서로 Alt 검수 카드를 다시 구성했습니다."
          : "모델 alts의 index/개수가 DOM의 <img> 순서와 맞지 않아 표시를 보정했습니다. 인덱스는 항상 코드의 <img> 선언 순서(1…N)입니다."
      );

      var reasonBase =
        alts.length === 0
          ? "표시 보정: 모델이 alts를 비웠거나 누락 — altProposals·현재 마크업 기준으로 구성"
          : "표시 보정: alts 개수·index 순서 불일치 — 재구성";
      var built = [];
      for (i = 0; i < n; i++) {
        var row = imgs[i] || { currentAlt: "", srcHint: "" };
        var cur = String(row.currentAlt || "");
        var prop = normProp[i];
        var decision = prop === cur ? "keep" : prop === "" && cur === "" ? "empty" : "fix";
        built.push({
          index: i + 1,
          srcHint: row.srcHint || "",
          currentAlt: cur,
          decision: decision,
          reason: reasonBase,
          proposal: prop
        });
      }
      obj.alts = built;
      return obj;
    }

    function detectPageLanguage(code) {
      var s = String(code || "");
      if (/[ぁ-んァ-ン一-龯]/.test(s)) return "Japanese";
      if (/[a-zA-Z]/.test(s) && !/[가-힣]/.test(s)) return "English";
      return "Korean";

    /** 미리보기·ZIP과 동일 규칙으로 assets 경로 → dataUrl (파일명 단독 매칭용 인덱스 포함, 동명이 파일 충돌 시 무시) */
    function buildPathToDataUrlMapFromPreview(previewList) {
      var pathToDataUrl = { __apBasename: Object.create(null) };
      (previewList || []).forEach(function (item) {
        if (!item) return;
        var n = item.name != null ? String(item.name) : "";
        var du = item.dataUrl != null ? String(item.dataUrl) : "";
        if (!n || !du) return;
        pathToDataUrl[n] = du;
        pathToDataUrl[n.toLowerCase()] = du;
        var base = n.split(/[/\\]/).pop();
        if (!base) return;
        var pcBn = toPcAssetPath(base).toLowerCase();
        var prev = pathToDataUrl.__apBasename[pcBn];
        if (prev && prev !== du) pathToDataUrl.__apBasename[pcBn] = "__MULTI__";
        else if (!prev) pathToDataUrl.__apBasename[pcBn] = du;
      });
      return pathToDataUrl;
    }

    function extractAssetPathFromImgSrc(src) {
      var s = String(src || "").trim();
      var m = s.match(/((?:\.\/)?assets\/images(?:_qa)?\/[^"'?#\s]+\.(?:png|jpg|jpeg|svg))/i);
      if (m) return m[1].replace(/^\.\//, "");
      m = s.match(
        /(assets\/images\/page_[a-zA-Z0-9_-]+_sec\d+_img\d+(_mo)?\.(?:png|jpg|jpeg|svg))/i
      );
      return m ? m[1] : "";
    }

    /** `_mo` → PC 파일명 (비전 첨부는 PC 에셋만 사용) */
    function toPcAssetPath(relativePath) {
      if (!relativePath) return "";
      var p = String(relativePath);
      if (/_mo\.(png|jpg|jpeg|svg)$/i.test(p)) {
        return p.replace(/_mo\.(png|jpg|jpeg|svg)$/i, ".$1");
      }
      return p;
    }

    /** 전체 상대경로 우선, 실패 시 파일명만으로 preview 에셋 매칭 (동명이 충돌 시 빈 문자열) */
    function resolvePreviewDataUrl(src, pathToDataUrl) {
      if (!src || !pathToDataUrl) return "";
      var rel = extractAssetPathFromImgSrc(src);
      if (rel) {
        var pcPath = toPcAssetPath(rel);
        return pathToDataUrl[pcPath] || pathToDataUrl[pcPath.toLowerCase()] || "";
      }
      var fm = String(src || "").match(/([^/?#]+\.(?:png|jpg|jpeg|svg))(?:\?|#|$)/i);
      if (!fm) return "";
      var pcBn = toPcAssetPath(fm[1]).toLowerCase();
      var bnMap = pathToDataUrl.__apBasename;
      if (!bnMap) return "";
      var du = bnMap[pcBn];
      if (!du || du === "__MULTI__") return "";
      return du;
    }

    function displayFileNameFromSrc(rawSrc) {
      var rel = extractAssetPathFromImgSrc(rawSrc);
      if (rel) {
        var parts = rel.split("/");
        return parts[parts.length - 1] || rel;
      }
      var fm = String(rawSrc || "").match(/([^/?#]+\.(?:png|jpg|jpeg|svg))(?:\?|#|$)/i);
      return fm ? toPcAssetPath(fm[1]) : "";
    }

    /** 판별용으로만 사용. PNG/SVG 등은 JPEG로 재인코딩해 용량·토큰 절감 */
    function dataUrlToDownscaledJpeg(dataUrl, maxEdge, quality) {
      return new Promise(function (resolve) {
        if (!dataUrl || String(dataUrl).indexOf("data:") !== 0) {
          resolve("");
          return;
        }
        var img = new Image();
        img.onload = function () {
          var w = img.naturalWidth || 0;
          var h = img.naturalHeight || 0;
          if (!w || !h) {
            resolve("");
            return;
          }
          var me = Math.max(64, Math.min(1024, Number(maxEdge) || AP_VISION_LONG_EDGE_DEFAULT));
          var scale = Math.min(me / w, me / h, 1);
          var cw = Math.max(1, Math.round(w * scale));
          var ch = Math.max(1, Math.round(h * scale));
          var canvas = document.createElement("canvas");
          canvas.width = cw;
          canvas.height = ch;
          var ctx = canvas.getContext("2d");
          if (!ctx) {
            resolve("");
            return;
          }
          ctx.drawImage(img, 0, 0, cw, ch);
          try {
            resolve(canvas.toDataURL("image/jpeg", quality));
          } catch (e) {
            resolve("");
          }
        };
        img.onerror = function () {
          resolve("");
        };
        img.src = dataUrl;
      });
    }

    /**
     * Chat Completions 멀티모달용: 텍스트 안내 + 슬롯별 [텍스트 라벨 → image_url] 인터리브
     * DOM article.ap-post 의 img 순서와 1:1(동일 src도 슬롯마다 JPEG 재첨부).
     * @returns {Promise<{ parts: Array|null, warnings: string[], diagnostics: object }>}
     */
    function buildVisionMultimodalAppend(htmlCode, previewList, maxEdgePx) {
      var warnings = [];
      var doc = parseAuditDocument(htmlCode);
      var imgs = queryArticlePostImgs(doc);
      var nDoc = imgs.length;
      var mePx = Math.max(128, Math.min(768, Number(maxEdgePx) || AP_VISION_LONG_EDGE_DEFAULT));
      var hasList = previewList && previewList.length;
      if (!hasList) {
        if (nDoc > 0) {
          warnings.push(
            "플러그인에서 PC(또는 MO) 분석을 실행해야 이미지 바이너리가 UI에 전달됩니다. ZIP 다운로드만 하고 코드만 붙여 넣은 경우 썸네일을 붙일 수 없어, alt는 src·파일명·현재 alt를 주로 씁니다. 제품명·시리즈명은 경로·파일명에서 보조로 쓸 수 있으나, 주변 HTML 문장 복붙은 금지입니다."
          );
        }
        return Promise.resolve({
          parts: null,
          warnings: warnings,
          diagnostics: {
            visionRequested: true,
            visionAttached: false,
            imagePartsSent: 0,
            imgTagsInFragment: nDoc,
            imgSlotsWithThumbnail: 0,
            uniqueAssetGroups: 0,
            uniqueAssetGroupsBeforeCap: 0,
            visionSlotsInPayload: 0,
            truncatedByCap: 0,
            unmatchedImgSlots: nDoc,
            maxEdgePx: mePx,
            imageApiDetail: AP_VISION_API_DETAIL,

    /** DOMParser 직렬화: 전체 HTML이면 doctype+documentElement. 조각이면 head+body를 합친다(body만 쓰면 meta 뒤 <style>이 head에 남아 사라짐). */
    function serializeAuditDocumentAfterEdit(doc, originalRaw) {
      var raw = String(originalRaw || "");
      if (!doc || !doc.documentElement) return raw;
      var t = raw.trimStart();
      var isFull = /^<!DOCTYPE/i.test(t) || /^<html[\s>]/i.test(t);

        if (/^<!DOCTYPE/i.test(t)) {
          var dm = t.match(/^<!DOCTYPE[^>]*>/i);
          if (dm) prefix = dm[0] + "\n";

        return prefix + doc.documentElement.outerHTML;
      }
      var head = doc.head;
      var body = doc.body;
      var hs = head && head.innerHTML ? String(head.innerHTML).trim() : "";
      var bs = body && body.innerHTML ? String(body.innerHTML).trim() : "";
      if (hs && bs) return hs + "\n\n" + bs;
      if (bs) return bs;
      if (hs) return hs;
      return doc.documentElement.outerHTML;
    }

    function applyAltProposalsToCodeRegex(html, list) {
      var i = 0;

    function countOccurrences(src, needle) {
      if (!needle) return 0;
      var count = 0;
      var pos = 0;
      while (true) {
        var idx = src.indexOf(needle, pos);
        if (idx === -1) break;
        count++;
        pos = idx + needle.length;
      }
      return count;

    /** 반영·붙여넣기 등 전체 HTML에서 잘못된 헤딩 여는 태그 정리 */

    function applyHeadingPatchesToCode(html, patches) {
      var list = (Array.isArray(patches) ? patches : []).filter(function (p) {
        return (
          p &&
          typeof p.before === "string" &&
          p.before.length &&
          p.after != null &&
          String(p.before) !== String(p.after)
        );
      });
      if (!list.length) return String(html || "");
      var out = String(html || "");

      for (var k = 0; k < list.length; k++) {
        var before = list[k].before;
        var after = sanitizeAiHeadingPatchAfterMarkup(list[k].after);
        var occ = countOccurrences(out, before);
        if (occ !== 1) continue;
        var pos = out.indexOf(before);
        if (pos === -1) continue;
        out = out.slice(0, pos) + after + out.slice(pos + before.length);
      }
      return stripRepeatedAngleBracketsBeforeHeadingOpens(out);

    /**
     * AI 반영 등으로 <span class="ap-text ap-section__title">...</span> 안에 h1–h6만 들어간 잘못된 패턴을
     * <h2 class="ap-text ap-section__title">...</h2> 형태로 합친다 (클래스·style 병합).

        .replace(/^\s+|\s+$/g, "");

      String(b || "").split(/\s+/).forEach(add);

        var merged = vals.reduce(function (acc, v) {

        if (restNoClass) out += " " + restNoClass;
        if (merged) out += ' class="' + escapeAttr(merged) + '"';
        out += selfClose ? " />" : ">";

      function summaryBlock(summary) {

          (summary.score != null ? '<span style="font-size:11px;color:#334;">score: <b>' + esc(summary.score) + "</b></span>" : "") +
          "</div>" +

      function seoContentRolesTable(struct) {

          '<div style="margin:0 0 12px 0;">' +

          "<tr>" +

        var missingEntities = Array.isArray(extractability.missingEntities) ? extractability.missingEntities : [];
        if (extractability.titleClear == null && !entityCoverage.length && !missingEntities.length) return "";
        return (
          '<div style="margin:0 0 12px 0;padding:10px;border:1px solid #e2e8f0;border-radius:8px;background:#fff;">' +

          '<div style="margin-bottom:6px;">회수된 엔티티: ' + (entityCoverage.length ? entityCoverage.map(esc).join(", ") : "없음") + "</div>" +

      function headingAuditBlock(headingAudit) {

              if (it.decision === "title") decisionStyle = "background:#edfdf3;color:#1c6b3b;border:1px solid #b7e4c7;";
              else if (it.decision === "subtitle") decisionStyle = "background:#fff7e6;color:#b7791f;border:1px solid #f6d28b;";
              else if (it.decision === "ambiguous") decisionStyle = "background:#fde8e8;color:#c53030;border:1px solid #feb2b2;";

                '<div style="padding:10px;border:1px solid #e2e8f0;border-radius:8px;background:#fff;">' +
                '<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:6px;">' +
                '<span style="display:inline-block;padding:1px 6px;border-radius:999px;font-size:10px;font-weight:700;' + decisionStyle + '">' + esc(it.decision || "") + "</span>" +
                (it.recommendedLevel ? '<code style="font-size:10px;background:#f6f8fb;padding:1px 6px;border-radius:4px;border:1px solid #e2e8f0;">' + esc(it.recommendedLevel) + "</code>" : "") +
                (it.selectorHint ? '<code style="font-size:10px;background:#f6f8fb;padding:1px 6px;border-radius:4px;border:1px solid #e2e8f0;">' + esc(it.selectorHint) + "</code>" : "") +
                "</div>" +
                '<div style="margin-bottom:4px;"><b>텍스트</b> · ' + esc(it.text || "") + "</div>" +
                (it.reason ? '<div><b>판정 이유</b> · ' + esc(it.reason) + "</div>" : "") +
                "</div>"
              );
            }).join("") +
            "</div></div>"
          );
        }

        return out;
      }

      function diffBlock(title, rows) {
        rows = Array.isArray(rows) ? rows : [];
        if (!rows.length) return "";
        return (
          '<div class="ap-diff-block ap-diff-block--changes">' +
          "<strong>" + esc(title) + "</strong>" +
          '<div class="ap-diff-rows">' +
          rows.map(function (r) {
            return (
              '<div class="ap-diff-row">' +
              '<div><span class="ap-diff-label ap-diff-label--from">변경 전</span><code class="ap-diff-from">' +
              r.from +
              "</code></div>" +
              '<div><span class="ap-diff-label ap-diff-label--to">변경 후</span><code class="ap-diff-to">' +
              r.to +
              "</code></div>" +
              "</div>"
            );
          }).join("") +
          "</div></div>"
        );
      }

      var summary = obj.summary || {};
      var seo = obj.seo || {};
      var legacyGeo = obj.geo || {};
      function mergeArrays(a, b) {
        a = Array.isArray(a) ? a : [];
        b = Array.isArray(b) ? b : [];
        return a.concat(b);
      }
      var seoIssues = mergeArrays(seo.issues, legacyGeo.issues);
      var seoSuggestions = mergeArrays(seo.suggestions, legacyGeo.suggestions);
      var seoContentRolesRows = Array.isArray(seo.contentRoles) && seo.contentRoles.length
        ? seo.contentRoles
        : Array.isArray(seo.structure) && seo.structure.length
          ? seo.structure
          : Array.isArray(legacyGeo.structure)
            ? legacyGeo.structure
            : [];
      var seoExtractabilityVal = seo.extractability != null ? seo.extractability : legacyGeo.extractability;
      var a11y = obj.a11y || {};
      var semantics = obj.semantics || {};
      var headingAudit = obj.headingAudit || {};
      var applyDiff =
        diffBlock("Alt 반영", obj._apAltChangeRows) +
        diffBlock("헤딩 반영", obj._apHeadingChangeRows);

      var cliWarns = Array.isArray(obj._apClientWarnings) ? obj._apClientWarnings.filter(Boolean) : [];
      var clientWarnBlock =
        cliWarns.length === 0
          ? ""
          : (
            '<div style="margin:0 0 14px 0;padding:12px 14px;border:1px solid #f6ad55;border-radius:8px;background:#fffaf0;color:#744210;line-height:1.45;">' +
            "<strong>클라이언트 알림</strong><ul style=\"margin:8px 0 0 18px;padding:0;\">" +
            cliWarns.map(function (w) {
              return "<li>" + esc(w) + "</li>";
            }).join("") +
            "</ul></div>"
          );

      var vd = obj._apVisionDiagnostics;
      var visionDiagBlock = "";
      if (AP_UI_SHOW_VISION_DIAGNOSTICS && vd && typeof vd === "object") {
        var yn = function (b) {
          return b ? "예" : "아니오";
        };
        var lines = [];
        lines.push(
          "<strong>요청 페이로드</strong> · OpenAI user 메시지에 JPEG(image_url, detail=" +
          esc(vd.imageApiDetail || "low") +
          ") 블록이 붙었는지: " +
          yn(!!vd.visionAttached) +
          " · 전송 장수 " +
          (vd.imagePartsSent != null ? vd.imagePartsSent : "—")
        );
        lines.push(
          "본문 &lt;img&gt; " +
          (vd.imgTagsInFragment != null ? vd.imgTagsInFragment : "—") +
          "개 중, 미리보기 에셋과 매칭된 슬롯 " +
          (vd.imgSlotsWithThumbnail != null ? vd.imgSlotsWithThumbnail : "—") +
          "개 · 매칭 실패 " +
          (vd.unmatchedImgSlots != null ? vd.unmatchedImgSlots : "—") +
          "개"
        );
        lines.push(
          "비전 페이로드 슬롯(상한 내 DOM 순서): " +
          (vd.visionSlotsInPayload != null
            ? vd.visionSlotsInPayload
            : vd.uniqueAssetGroupsBeforeCap != null
              ? vd.uniqueAssetGroupsBeforeCap
              : "—") +
          "칸 · API에 첨부된 JPEG(image_url) " +
          (vd.uniqueAssetGroups != null ? vd.uniqueAssetGroups : "—") +
          "장" +
          (vd.truncatedByCap > 0
            ? " · 본문 img " + vd.truncatedByCap + "개는 상한(" + AP_VISION_MAX_IMAGES + ")으로 JPEG 미첨부"
            : "")
        );
        lines.push(
          "썸네일 긴 변 약 " +
          (vd.maxEdgePx != null ? vd.maxEdgePx : "—") +
          "px · UI 보유 바이너리 " +
          (vd.previewBinaryCount != null ? vd.previewBinaryCount : "—") +
          "건"
        );
        lines.push(
          '<span style="opacity:0.92">모델이 픽셀을 참고했다는 것은 API 밖에서 확정할 수 없습니다. 위 수치는 <b>클라이언트가 보낸 요청</b> 기준입니다. 본문 HTML·파일명에는 없는 내용만 그림에 있는데 alt가 그걸 따르면, 주변 텍스트 복붙이 아니라 비전 반영 가능성이 높습니다.</span>'
        );
        visionDiagBlock =
          '<div style="margin:0 0 14px 0;padding:12px 14px;border:1px solid #90cdf4;border-radius:8px;background:#ebf8ff;color:#1a365d;line-height:1.55;font-size:12px;">' +
          '<div style="font-weight:700;margin-bottom:8px;color:#086fbf;">Alt·비전 진단(전송 여부)</div>' +
          lines
            .map(function (line) {
              return '<div style="margin-bottom:6px;">' + line + "</div>";
            })
            .join("") +
          (vd.payloadNote
            ? '<div style="margin-top:8px;font-size:10px;opacity:0.85;"><code>' + esc(vd.payloadNote) + "</code></div>"
            : "") +
          "</div>";
      }

      return (
        clientWarnBlock +
        visionDiagBlock +
        summaryBlock(summary) +
        applyDiff +
        issueList("SEO 이슈", seoIssues) +
        simpleList("SEO 제안", seoSuggestions) +
        seoContentRolesTable(seoContentRolesRows) +
        seoExtractabilityBlock(seoExtractabilityVal) +
        issueList("접근성 이슈", a11y.issues) +
        simpleList("접근성 제안", a11y.suggestions) +
        issueList("시멘틱 마크업 이슈", semantics.issues) +
        simpleList("시멘틱 마크업 제안", semantics.suggestions) +
        altAuditBlock(obj.alts) +
        headingAuditBlock(headingAudit) +
        issueList("Heading 구조 이슈", headingAudit.issues) +
        simpleList("반영 메모", Array.isArray(obj.applyNotes) ? obj.applyNotes : [])
      );
    }

    function renderAuditReport(obj) {
      var el = $("#aiAuditReport");
      if (!el) return;
      var inner = buildAuditReportInnerHtml(obj);
      el.innerHTML = inner;
      el.classList.toggle("is-visible", !!inner.trim());
    }

    function runAiAudit() {
      if (!ensureOpenAiKeyExists()) return;
      if (!ensureCodeExists()) return;
      var code = getCodeValue();
      var codeForAudit = extractCmsPartForAudit(code);
      var nImgInFragment = countImgs(codeForAudit);
      var btn = $("#btnAiAudit");
      if (btn) btn.disabled = true;
      setAiStatus("검수 리포트 생성 중…");

      var useVision = true;
      var maxEdge = AP_VISION_LONG_EDGE_DEFAULT;

      var visionPromise = useVision
        ? buildVisionMultimodalAppend(codeForAudit, previewImages, maxEdge)
        : Promise.resolve({
          parts: null,
          warnings: [],
          diagnostics: {
            visionRequested: false,
            visionAttached: false,
            imagePartsSent: 0,
            imgTagsInFragment: nImgInFragment,
            imgSlotsWithThumbnail: 0,
            uniqueAssetGroups: 0,
            uniqueAssetGroupsBeforeCap: 0,
            visionSlotsInPayload: 0,
            truncatedByCap: 0,
            unmatchedImgSlots: nImgInFragment,
            maxEdgePx: maxEdge,
            imageApiDetail: AP_VISION_API_DETAIL,
            previewBinaryCount: (previewImages || []).length,
            payloadNote: "vision_flag_off"
          }
        });

      visionPromise
        .then(function (pack) {
          var visionAppend = pack && pack.parts;
          var preWarnings = (pack && pack.warnings) || [];
          var nThumb =
            pack && pack.diagnostics && pack.diagnostics.imagePartsSent != null
              ? pack.diagnostics.imagePartsSent
              : 0;
          if (visionAppend && nThumb > 0) {
            setAiStatus("검수 리포트 생성 중(썸네일 " + nThumb + "장)…");
          } else if (useVision && (!visionAppend || nThumb === 0)) {
            setAiStatus("검수 리포트 생성 중(썸네일 없음 또는 일부만 · 상세는 리포트 알림)…");
          }
          return runOpenAiAnalysisApi(codeForAudit, visionAppend).then(function (obj) {
            obj._apClientWarnings = preWarnings.slice();
            obj._apVisionDiagnostics = pack && pack.diagnostics ? pack.diagnostics : null;
            normalizeImgAltAudit(codeForAudit, obj);
            return obj;
          });
        })
        .then(function (obj) {
          window.__apLastAuditReport = obj;
          window.__apLastAuditAltProposals = Array.isArray(obj.altProposals) ? obj.altProposals : null;
          window.__apLastAnalysisReport = obj;
          window.__apLastAnalysisImgCount = nImgInFragment;
          renderAuditReport(obj);

          var summary = obj && obj.summary ? obj.summary : {};
          var label = summary.oneLine ? summary.oneLine : "검수 완료";
          setAiStatus("검수 완료 · " + label);
          var aw = Array.isArray(obj._apClientWarnings) ? obj._apClientWarnings.filter(Boolean) : [];
          if (aw.length) {
            alert("[AI 검수 알림]\n\n" + aw.join("\n\n"));
          }
        })
        .catch(function (e) {
          setAiStatus("검수 실패: " + (e && e.message ? e.message : String(e)));
        })
        .then(function () {
          if (btn) btn.disabled = false;
        });
    }

    var btnAiAudit = $("#btnAiAudit");
    if (btnAiAudit) btnAiAudit.onclick = runAiAudit;

    var btnApplyAlt = $("#btnApplyAltProposals");
    if (btnApplyAlt) {
      btnApplyAlt.onclick = function () {
        if (!ensureOpenAiKeyExists()) return;
        if (!ensureCodeExists()) return;
        var code = getCodeValue();
        var codeForApplyApi = extractCmsPartForAudit(code);
        if (!String(codeForApplyApi).trim()) codeForApplyApi = code;
        var n = countImgs(code);
        var nApi = countImgs(codeForApplyApi);
        var btn = this;
        btn.disabled = true;
        setAiStatus("반영: AI 실행 중 (헤딩 패치 · 분석과 동일 alt)…");
        runOpenAiApplyApi(codeForApplyApi, window.__apLastAnalysisReport)
          .then(function (obj) {
            var code0 = code;
            if (!Array.isArray(obj.altProposals)) obj.altProposals = [];
            if (!Array.isArray(obj.headingPatches)) obj.headingPatches = [];
            var auditSnap = window.__apLastAnalysisReport;
            if (
              auditSnap &&
              Array.isArray(auditSnap.altProposals) &&
              auditSnap.altProposals.length === nApi &&
              window.__apLastAnalysisImgCount === nApi &&
              n === nApi
            ) {
              obj.altProposals = auditSnap.altProposals.slice();
            }
            var patches = obj.headingPatches;
            code = applyHeadingPatchesToCode(code, patches);
            code = normalizeApHeadingSpanWrappers(code);

            var pApply = obj.altProposals.slice();
            var didHeading = patches.length > 0;
            var didAlt = false;

            if (pApply.length > 0 && n > 0) {
              if (pApply.length !== n) {
                if (
                  !confirm(
                    "img " +
                    n +
                    "개 vs alt " +
                    pApply.length +
                    "개 (불일치). 그래도 alt 반영할까요? (취소 시 alt만 생략 · 헤딩은 이미 적용됨)"
                  )
                ) {
                  pApply = [];
                }
              }
              if (pApply.length > 0) {
                code = applyAltProposalsToCode(code, pApply);
                didAlt = true;
              }
            }

            var reportObj = Object.assign({}, obj, {
              _apAltChangeRows: didAlt ? buildAltChangeRowsForPanel(code0, pApply) : [],
              _apHeadingChangeRows: buildHeadingChangeRowsForPanel(patches)
            });

            window.__apLastAuditReport = reportObj;
            window.__apLastAuditAltProposals = Array.isArray(obj.altProposals) ? obj.altProposals : null;
            renderAuditReport(reportObj);

            code = stripRepeatedAngleBracketsBeforeHeadingOpens(code);
            code = dedupeDuplicateClassAttributes(code);
            code = stripEmbeddedAuditReport(code);
            setCodeValue(code);

            var parts = [];
            if (didAlt) parts.push("alt " + reportObj._apAltChangeRows.length + "건");
            if (didHeading && reportObj._apHeadingChangeRows.length) parts.push("헤딩 " + reportObj._apHeadingChangeRows.length + "건");

            setAiStatus(
              parts.length
                ? "반영 완료 (" + parts.join(", ") + ") · 상세는 패널"
                : "반영 완료 (변경 없음 또는 스킵) · 패널 확인"
            );
          })
          .catch(function (e) {
            setAiStatus("반영 실패: " + (e && e.message ? e.message : String(e)));
          })
          .then(function () {
            btn.disabled = false;
          });
      };
    }

    $("#exportZip").onclick = function () {
      var code = stripEmbeddedAuditReport(($("#codeOut") && $("#codeOut").value) || "");
      if (!code.trim()) return;
      var btn = this;
      btn.disabled = true;
      btn.textContent = "내보내는 중…";
      parent.postMessage({
        pluginMessage: {
          type: "EXPORT_ZIP",
          projectName: getProjectName(),
          allowedFonts: getAllowedFonts(),
          fontHtmlFilterActive: hasAnalyzedOnce,
          code: code,
        },
      }, "*");
    };

    function setExportZipReady() {
      var btn = $("#exportZip");
      if (btn) {
        btn.disabled = false;
        btn.textContent = "Export ZIP";
      }
    }
  </script>
</body>

</html>
